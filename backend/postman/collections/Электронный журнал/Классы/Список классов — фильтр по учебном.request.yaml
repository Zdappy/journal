$kind: http-request
name: Список классов — фильтр по учебному году
url: "{{baseUrl}}/classes?academic_year=2026"
method: GET
queryParams:
  academic_year: "2026"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Все классы имеют academic_year = 2026', function () {
          json.items.forEach(function (i) {
              pm.expect(i.academic_year).to.eql(2026);
          });
      });
    language: text/javascript
order: 2000
