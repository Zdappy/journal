$kind: http-request
url: "{{baseUrl}}/classes/{{classId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('В сообщении есть слово «удалён»', function () {
          pm.expect(pm.response.json().message).to.include('удалён');
      });
    language: text/javascript
order: 6000
