$kind: http-request
url: "{{baseUrl}}/classes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('В базе не менее 3 классов', function () {
          pm.expect(json.total).to.be.at.least(3);
      });
      pm.test('Ответ содержит items и total', function () {
          pm.expect(json).to.have.property('items');
          pm.expect(json).to.have.property('total');
      });
    language: text/javascript
order: 1000
