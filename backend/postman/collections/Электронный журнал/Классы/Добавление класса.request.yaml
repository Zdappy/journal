$kind: http-request
url: "{{baseUrl}}/classes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "9А",
      "academic_year": {{classYear}}
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('classYear', String(2027 + (Date.now() % 70)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Статус 201', function () {
          pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test('Класс создан с названием 9А', function () {
          pm.expect(json.name).to.eql('9А');
      });
      pm.collectionVariables.set('classId', json.id);
    language: text/javascript
order: 4000
