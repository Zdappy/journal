$kind: http-request
url: "{{baseUrl}}/subjects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 400', function () {
          pm.response.to.have.status(400);
      });
      pm.test('message — массив сообщений валидации', function () {
          pm.expect(pm.response.json().message).to.be.an('array');
      });
    language: text/javascript
order: 1000
