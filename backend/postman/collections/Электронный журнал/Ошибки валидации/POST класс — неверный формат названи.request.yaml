$kind: http-request
name: POST класс — неверный формат названия (400)
url: "{{baseUrl}}/classes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "5а",
      "academic_year": 2026
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 400', function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      const msg = Array.isArray(json.message) ? json.message.join(' ') : json.message;
      pm.test('Сообщение про формат «5А»', function () {
          pm.expect(msg).to.include('формат');
      });
    language: text/javascript
order: 6000
