$kind: http-request
name: POST класс — несуществующий учитель (404)
url: "{{baseUrl}}/classes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "8Б",
      "academic_year": 2026,
      "homeroom_teacher_id": 9999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 404', function () {
          pm.response.to.have.status(404);
      });
      pm.test('Сообщение про учителя', function () {
          pm.expect(pm.response.json().message).to.include('Учитель');
      });
    language: text/javascript
order: 7000
