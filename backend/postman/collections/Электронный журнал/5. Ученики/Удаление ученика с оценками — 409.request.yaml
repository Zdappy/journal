$kind: http-request
url: "{{baseUrl}}/students/1"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 409', () => pm.response.to.have.status(409));
      const json = pm.response.json();
      pm.test('Сообщение про оценки', () => pm.expect(json.message).to.include('оценки'));
    language: text/javascript
order: 11000
