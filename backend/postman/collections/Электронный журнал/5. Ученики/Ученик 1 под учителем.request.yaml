$kind: http-request
url: "{{baseUrl}}/students/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Петров', () => pm.expect(json.user.lastname).to.eql('Петров'));
    language: text/javascript
order: 5000
