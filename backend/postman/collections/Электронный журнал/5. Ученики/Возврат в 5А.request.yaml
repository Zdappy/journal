$kind: http-request
url: "{{baseUrl}}/students/1"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "class_id": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Класс возвращён', () => pm.expect(json.class_id).to.eql(1));
    language: text/javascript
order: 9000
