$kind: http-request
url: "{{baseUrl}}/classes/1"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 409', () => pm.response.to.have.status(409));
      const json = pm.response.json();
      pm.test('Сообщение про учеников', () => pm.expect(json.message).to.include('ученик'));
    language: text/javascript
order: 8000
