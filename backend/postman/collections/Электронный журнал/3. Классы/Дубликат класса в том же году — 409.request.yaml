$kind: http-request
url: "{{baseUrl}}/classes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "5А",
      "academic_year": 2026
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 409', () => pm.response.to.have.status(409));
      const json = pm.response.json();
      pm.test('Сообщение про учебный год', () => pm.expect(json.message).to.include('учебном году'));
    language: text/javascript
order: 6000
