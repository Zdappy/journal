$kind: http-request
url: "{{baseUrl}}/classes?academic_year=2026"
method: GET
queryParams:
  academic_year: "2026"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Все классы 2026 года', () => json.items.forEach((i) => pm.expect(i.academic_year).to.eql(2026)));
    language: text/javascript
order: 2000
