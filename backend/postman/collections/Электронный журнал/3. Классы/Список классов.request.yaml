$kind: http-request
url: "{{baseUrl}}/classes"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Не менее 3 классов', () => pm.expect(json.total).to.be.at.least(3));
    language: text/javascript
order: 1000
