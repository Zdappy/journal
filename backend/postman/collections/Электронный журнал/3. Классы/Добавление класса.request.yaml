$kind: http-request
url: "{{baseUrl}}/classes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "9А",
      "academic_year": {{classYear}}
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('classYear', String(2030 + (Date.now() % 70)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.collectionVariables.set('classId', json.id);
    language: text/javascript
order: 4000
