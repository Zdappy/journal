$kind: http-request
url: "{{baseUrl}}/classes/{{classId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "homeroom_teacher_id": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('ФИО подтянулись (include)', () => pm.expect(json.homeroomTeacher.user.lastname).to.eql('Иванов'));
    language: text/javascript
order: 5000
