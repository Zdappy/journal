$kind: http-request
url: "{{baseUrl}}/assignments/my"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{teacher2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Два назначения', () => pm.expect(json).to.have.lengthOf(2));
    language: text/javascript
order: 2000
