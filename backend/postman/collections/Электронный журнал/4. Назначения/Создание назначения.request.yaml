$kind: http-request
url: "{{baseUrl}}/assignments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "teacher_id": 1,
      "subject_id": 3,
      "class_id": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.collectionVariables.set('assignmentId', json.id);
    language: text/javascript
order: 6000
