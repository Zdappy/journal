$kind: http-request
url: "{{baseUrl}}/absences"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Один свой пропуск', () => pm.expect(json.total).to.eql(1));
    language: text/javascript
order: 2000
