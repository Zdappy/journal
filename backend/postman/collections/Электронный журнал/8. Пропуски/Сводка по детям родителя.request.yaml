$kind: http-request
url: "{{baseUrl}}/absences/summary"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{parentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Два ученика', () => pm.expect(json).to.have.lengthOf(2));
      pm.test('У ученика 1 один пропуск', () => pm.expect(json.find((s) => s.student_id === 1).total).to.eql(1));
    language: text/javascript
order: 3000
