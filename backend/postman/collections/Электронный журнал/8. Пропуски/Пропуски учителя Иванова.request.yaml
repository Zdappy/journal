$kind: http-request
url: "{{baseUrl}}/absences"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Один пропуск', () => pm.expect(json.total).to.eql(1));
    language: text/javascript
order: 1000
