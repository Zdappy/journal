$kind: http-request
name: Повторная отметка на ту же дату — 409
url: "{{baseUrl}}/absences"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "student_id": 1,
      "assignment_id": 1,
      "lesson_date": "2026-11-10",
      "absence_type": "Болезнь"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 409', () => pm.response.to.have.status(409));
      const json = pm.response.json();
      pm.test('Сообщение про дату', () => pm.expect(json.message).to.include('уже отмечен пропуск'));
    language: text/javascript
order: 5000
