$kind: http-request
url: "{{baseUrl}}/grades/average"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{parentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Два ученика', () => pm.expect(json).to.have.lengthOf(2));
    language: text/javascript
order: 6000
