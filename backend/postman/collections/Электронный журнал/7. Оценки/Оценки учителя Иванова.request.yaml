$kind: http-request
url: "{{baseUrl}}/grades"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Семь оценок по своим назначениям', () => pm.expect(json.total).to.eql(7));
    language: text/javascript
order: 1000
