$kind: http-request
url: "{{baseUrl}}/grades/average?student_id=1"
method: GET
queryParams:
  student_id: "1"
auth:
  type: bearer
  credentials:
    token: "{{parent2Token}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 8000
