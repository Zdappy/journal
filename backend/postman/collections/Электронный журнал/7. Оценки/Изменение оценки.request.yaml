$kind: http-request
url: "{{baseUrl}}/grades/{{gradeId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "value": 4
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Оценка изменена', () => pm.expect(json.value).to.eql(4));
    language: text/javascript
order: 14000
