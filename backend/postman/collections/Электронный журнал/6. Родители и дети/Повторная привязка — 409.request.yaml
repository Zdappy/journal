$kind: http-request
url: "{{baseUrl}}/parent-student"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "parent_id": 1,
      "student_id": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 409', () => pm.response.to.have.status(409));
      const json = pm.response.json();
      pm.test('Сообщение фильтра', () => pm.expect(json.message).to.include('уже привязан'));
    language: text/javascript
order: 7000
