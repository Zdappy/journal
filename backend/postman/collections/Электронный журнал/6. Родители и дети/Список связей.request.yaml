$kind: http-request
url: "{{baseUrl}}/parent-student"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Три связи', () => pm.expect(json).to.have.lengthOf(3));
    language: text/javascript
order: 5000
