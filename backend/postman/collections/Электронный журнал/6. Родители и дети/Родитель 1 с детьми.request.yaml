$kind: http-request
url: "{{baseUrl}}/parents/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Двое детей', () => pm.expect(json.children).to.have.lengthOf(2));
    language: text/javascript
order: 2000
