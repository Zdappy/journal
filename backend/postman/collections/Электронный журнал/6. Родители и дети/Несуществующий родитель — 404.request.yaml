$kind: http-request
url: "{{baseUrl}}/parent-student"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "parent_id": 9999,
      "student_id": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Статус 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 8000
