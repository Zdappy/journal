$kind: http-request
url: "{{baseUrl}}/parents"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Не менее 2 родителей', () => pm.expect(json.total).to.be.at.least(2));
    language: text/javascript
order: 1000
