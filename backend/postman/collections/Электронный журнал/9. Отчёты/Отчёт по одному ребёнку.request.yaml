$kind: http-request
url: "{{baseUrl}}/reports/parent?student_id=2"
method: GET
queryParams:
  student_id: "2"
auth:
  type: bearer
  credentials:
    token: "{{parentToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Один ребёнок', () => pm.expect(json).to.have.lengthOf(1));
    language: text/javascript
order: 2000
