$kind: http-request
name: Список предметов — поиск без учёта регистра
url: "{{baseUrl}}/subjects?search=мат"
method: GET
queryParams:
  search: мат
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('Поиск вернул хотя бы один предмет', function () {
          pm.expect(json.items.length).to.be.at.least(1);
      });
      pm.test('Все найденные содержат «мат»', function () {
          json.items.forEach(function (i) {
              pm.expect(i.name.toLowerCase()).to.include('мат');
          });
      });
    language: text/javascript
order: 2000
