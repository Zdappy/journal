$kind: http-request
url: "{{baseUrl}}/auth/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "x1",
      "password": "123456",
      "role": "Ученик",
      "lastname": "Х",
      "firstname": "Х",
      "class_id": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{parentToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 6000
