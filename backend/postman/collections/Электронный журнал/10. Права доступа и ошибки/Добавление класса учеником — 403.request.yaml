$kind: http-request
url: "{{baseUrl}}/classes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "7А",
      "academic_year": 2026
    }
auth:
  type: bearer
  credentials:
    token: "{{studentToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Статус 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
