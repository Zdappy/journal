$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "hacker1",
      "password": "123456",
      "lastname": "Х",
      "firstname": "Х",
      "role": "Учитель"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 400', () => pm.response.to.have.status(400));
      const json = pm.response.json();
      pm.test('Роль отклонена', () => pm.expect(JSON.stringify(json.message)).to.include('should not exist'));
    language: text/javascript
order: 7000
