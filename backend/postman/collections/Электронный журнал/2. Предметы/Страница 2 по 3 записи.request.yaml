$kind: http-request
url: "{{baseUrl}}/subjects?page=2&limit=3"
method: GET
queryParams:
  page: "2"
  limit: "3"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Страница 2', () => pm.expect(json.page).to.eql(2));
      pm.test('Не более 3 записей', () => pm.expect(json.items.length).to.be.at.most(3));
    language: text/javascript
order: 4000
