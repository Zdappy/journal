$kind: http-request
url: "{{baseUrl}}/subjects/{{subjectId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Название совпадает', () => pm.expect(json.name).to.eql(pm.collectionVariables.get('subjectName')));
    language: text/javascript
order: 6000
