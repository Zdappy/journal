$kind: http-request
url: "{{baseUrl}}/subjects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{subjectName}}",
      "description": "Создан автотестом"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('subjectName', 'Автотест ' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Статус 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test('Присвоен id', () => pm.expect(json.id).to.be.a('number'));
      pm.collectionVariables.set('subjectId', json.id);
    language: text/javascript
order: 5000
