$kind: http-request
url: "{{baseUrl}}/subjects?search=мат"
method: GET
queryParams:
  search: мат
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Найдена Математика', () => pm.expect(json.items.some((i) => i.name === 'Математика')).to.be.true);
    language: text/javascript
order: 2000
