$kind: http-request
url: "{{baseUrl}}/subjects/{{subjectId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Сообщение об удалении', () => pm.expect(json.message).to.include('удалён'));
    language: text/javascript
order: 9000
